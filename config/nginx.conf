worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    upstream backend_pool {
        server 10.7.12.144:3001;
        server 10.7.16.85:3002;
    }

    # HTTP → HTTPS
    server {
        listen 80;
        server_name app.dimaginaxal.test;

        return 301 https://$host$request_uri;
    }

    # HTTPS reverse proxy + load balancer
    server {
        listen 443 ssl;
        server_name app.dimaginaxal.test;

        ssl_certificate /opt/homebrew/etc/nginx/certs/app.dimaginaxal.test.pem;
        ssl_certificate_key /opt/homebrew/etc/nginx/certs/app.dimaginaxal.test-key.pem;

        location / {
            proxy_pass http://backend_pool;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
