# Phase 2 – BACKUP DNS  (Mac 3, 10.7.27.218)   Extension A
# Run:  sudo dnsmasq -C config/phase2/dnsmasq-backup.conf -d
# Must hold exactly the same records as dnsmasq-primary.conf.
# Whenever a record changes, change it in BOTH files and restart BOTH.

port=53
listen-address=127.0.0.1,10.7.27.218
bind-interfaces

local-ttl=30

address=/app.dimaginaxal.test/10.7.29.80
address=/api.dimaginaxal.test/10.7.29.80
address=/ttl.dimaginaxal.test/10.7.29.80
no-resolv
 
server=1.1.1.1
server=8.8.8.8

cache-size=1000
log-queries
