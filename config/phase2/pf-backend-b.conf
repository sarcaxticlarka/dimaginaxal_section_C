# Phase 2 – Extension C: service isolation for Backend B  (Mac 4)
# Only the edge (Mac 2, 10.7.29.80) may open TCP connections to port 3002.
#
# Load:      sudo pfctl -f config/phase2/pf-backend-b.conf && sudo pfctl -e
# Show:      sudo pfctl -sr
# Rollback:  sudo pfctl -f /etc/pf.conf          (restores Apple's default rules)
#            sudo pfctl -d                        (only if pf was disabled before)

edge = "10.7.29.80"

# Never filter this Mac's own loopback traffic.
pass in quick on lo0 all

# The edge may reach the backend.
pass in quick proto tcp from $edge to any port 3002

# Everyone else is silently dropped (client sees a timeout, not "refused").
block drop in quick proto tcp from any to any port 3002

# Everything else (ping, DNS on 53, SSH, ...) is left alone: pf passes by default.
