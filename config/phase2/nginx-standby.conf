# Phase 2 – STANDBY EDGE nginx  (Mac 3, 10.7.27.218)   Extension E
# Identical to nginx.conf except the X-Edge value. Same cert + key as Mac 2.
# On an Intel Mac replace /opt/homebrew with /usr/local everywhere.
# Install:  sudo cp config/phase2/nginx-standby.conf /opt/homebrew/etc/nginx/nginx.conf
#           sudo nginx -t && sudo nginx -s reload
#
# Changes from Phase 1:
#   - passive health checks + retry on the next backend   (Extension D)
#   - X-Edge header so we can see WHICH edge answered     (Extension E)
#   - access log showing which upstream served each request
#   - HTTP/2 enabled (course topic: HTTP/1.1 vs HTTP/2)

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    log_format edge '$remote_addr [$time_local] "$request" $status '
                    'upstream=$upstream_addr upstream_status=$upstream_status';
    access_log /opt/homebrew/var/log/nginx/edge.log edge;

    upstream backend_pool {
        # After 1 failed attempt, a backend is skipped for 10 s,
        # then nginx tries it again (passive health check).
        server 10.7.27.218:3001 max_fails=1 fail_timeout=10s;
        server 10.7.11.150:3002  max_fails=1 fail_timeout=10s;
    }

    # HTTP -> HTTPS
    server {
        listen 80;
        server_name app.dimaginaxal.test;
        return 301 https://$host$request_uri;
    }

    # HTTPS reverse proxy + load balancer
    server {
        listen 443 ssl;
        http2 on;
        server_name app.dimaginaxal.test;

        ssl_certificate     /opt/homebrew/etc/nginx/certs/app.dimaginaxal.test.pem;
        ssl_certificate_key /opt/homebrew/etc/nginx/certs/app.dimaginaxal.test-key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        add_header X-Edge "mac3-standby" always;

        location / {
            proxy_pass http://backend_pool;

            # Fail fast and retry on the other backend.
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
