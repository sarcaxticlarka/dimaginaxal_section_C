# Phase 2 – PRIMARY DNS  (Mac 1, 10.7.12.240)
# Run:  sudo dnsmasq -C config/phase2/dnsmasq-primary.conf -d
# Must hold exactly the same records as dnsmasq-backup.conf.

port=53
listen-address=127.0.0.1,10.7.12.240
bind-interfaces

# Extension B: answers for our own records carry a 30 s TTL
# (Phase 1 used the dnsmasq default of 0, so clients never cached).
local-ttl=30

address=/app.dimaginaxal.test/10.7.29.80
address=/api.dimaginaxal.test/10.7.29.80

# Extension B demo record: change this IP during the TTL demo.
address=/ttl.dimaginaxal.test/10.7.29.80

no-resolv
server=1.1.1.1
server=8.8.8.8

cache-size=1000
log-queries
